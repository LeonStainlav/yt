<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart YouTube to MP4 Converter</title>
    
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --primary: #ec4899;
            --primary-hover: #db2777;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--bg-card);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 1px solid #334155;
        }

        h2 { font-size: 24px; margin-bottom: 20px; }
        
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #111827;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--primary-hover); }

        #result-area {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #0f172a;
            min-height: 50px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>YouTube to MP4 Downloader</h2>
    
    <input type="text" id="yt-url" placeholder="Tempel link YouTube di sini...">
    
    <button onclick="downloadVideo()">Mulai Konversi</button>
    
    <div id="result-area">Status: Menunggu link...</div>
</div>

<script>
    async function downloadVideo() {
        const videoUrl = document.getElementById("yt-url").value;
        const resultArea = document.getElementById("result-area");
        const pipedreamUrl = "https://eofkhdus0dqq7cd.m.pipedream.net";

        if (!videoUrl) {
            alert("Silakan masukkan link YouTube!");
            return;
        }

        resultArea.innerText = "Memproses video, mohon tunggu...";

        try {
            const response = await fetch(`${pipedreamUrl}?url=${encodeURIComponent(videoUrl)}`);
            const data = await response.json();
            
            if (data.link) {
                resultArea.innerHTML = `Berhasil! <br><br> <a href="${data.link}" target="_blank" style="color: #10b981; font-weight: bold;">Klik di sini untuk download MP4</a>`;
            } else {
                resultArea.innerText = "Gagal mendapatkan link. Pastikan link YouTube benar.";
            }
        } catch (error) {
            resultArea.innerText = "Terjadi kesalahan koneksi ke server.";
        }
    }
</script>

</body>
</html>
