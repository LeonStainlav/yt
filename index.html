<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>YT Downloader</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; padding-top: 50px; }
        .box { background: #1e293b; padding: 30px; border-radius: 15px; width: 400px; text-align: center; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: none; }
        button { background: #ec4899; color: white; padding: 10px; width: 100%; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
<div class="box">
    <h2>YouTube Downloader</h2>
    <input type="text" id="url" placeholder="Tempel link YouTube...">
    <button onclick="prosesDownload()">Download</button>
    <div id="hasil" style="margin-top:20px;"></div>
</div>

<script>
    async function prosesDownload() {
        const url = document.getElementById('url').value;
        const hasil = document.getElementById('hasil');
        const pipedream = "https://eofkhdus0dqq7cd.m.pipedream.net";

        hasil.innerText = "Memproses...";

        try {
            const res = await fetch(`${pipedream}?url=${encodeURIComponent(url)}`);
            const data = await res.json();

            // Sesuaikan dengan respon dari API YTStream
            if (data.url) {
                hasil.innerHTML = `<a href="${data.url}" target="_blank" style="color:#10b981">Klik di sini untuk download!</a>`;
            } else {
                hasil.innerText = "Gagal memproses video.";
            }
        } catch (e) {
            hasil.innerText = "Error koneksi ke server.";
        }
    }
</script>
</body>
</html>
